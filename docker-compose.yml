services:
  starfire:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
