<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Log in · starfire.ai</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="assets/logo.svg" alt="" />
    <h1>starfire.ai</h1>
    <p class="login-sub">Log in with your Open WebUI account.</p>
    <form id="loginForm" novalidate>
      <label for="loginEmail">Email</label>
      <input id="loginEmail" name="email" type="email" autocomplete="username" required autofocus />
      <label for="loginPassword">Password</label>
      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button class="login-submit" id="loginSubmit" type="submit">Log in</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
