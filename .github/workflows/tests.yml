name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes server.py server_configs tests import_openwebui_users.py import_openwebui_data.py reset_password.py
      - run: python -m pytest -q
        env:
          DATA_DIR: ${{ runner.temp }}/starfire-test-data
      - run: node --check static/appState.js && node --check static/chatMessages.js && node --check static/codeBlocks.js && node --check static/chatCards.js && node --check static/chatSend.js && node --check static/helperTasks.js && node --check static/settings.js && node --check static/settingsMemoryTasks.js && node --check static/settingsEmail.js && node --check static/settingsNotes.js && node --check static/settingsSystem.js && node --check static/compare.js && node --check static/palette.js && node --check static/app.js && node --check static/workspace.js && node --check static/uiLogic.js && node --check static/login.js && node --check static/setup.js && node --check static/artyPage.js && node --check static/artyCli.js && node --check static/artyCliLogic.js && node --check static/artyDevices.js && node --check static/artyDevicesLogic.js && node --check static/loginNext.js && node --check static/providers.js && node --check static/streamingRenderer.js && node --check static/streamingSegmenter.js && node --check static/sideChat.js && node --check static/answerGuard.js
      - run: node --test tests/js/*.test.js
